<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kick The Arham</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #1b1b2f;
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
#c { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; }

#top {
  position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center;
  justify-content: space-between; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; pointer-events: none;
}
#top > * { pointer-events: auto; }
#bucks {
  background: #ffd84d; color: #5a3b00; font-weight: 800; font-size: 20px;
  padding: 6px 14px; border-radius: 999px; border: 3px solid #5a3b00;
  box-shadow: 0 3px 0 #5a3b00; min-width: 90px; transition: transform .1s;
}
#bucks.pulse { transform: scale(1.12); }
#title {
  color: #fff; font-size: 22px; font-weight: 800; letter-spacing: .5px;
  text-shadow: 0 3px 0 #000, 0 0 12px rgba(0,0,0,.5); text-align: center; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#title b { color: #ff5d73; }
.btns { display: flex; gap: 6px; }
.btns button {
  width: 40px; height: 40px; font-size: 20px; border-radius: 12px; cursor: pointer;
  background: #fff; border: 3px solid #222; box-shadow: 0 3px 0 #222; padding: 0;
}
.btns button:active { transform: translateY(2px); box-shadow: 0 1px 0 #222; }

#tools {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); overflow-x: auto;
  background: linear-gradient(#2a2346, #17122b); border-top: 4px solid #000;
  scrollbar-width: none;
}
#tools::-webkit-scrollbar { display: none; }
.tool {
  flex: 0 0 auto; width: 74px; height: 74px; border-radius: 16px; cursor: pointer;
  background: #fff; border: 3px solid #000; box-shadow: 0 4px 0 #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; font-weight: 700; font-size: 11px; color: #222; padding: 2px;
}
.tool .ic { font-size: 30px; line-height: 1.1; }
.tool.active { background: #ffd84d; transform: translateY(-4px); box-shadow: 0 8px 0 #000; }
.tool.locked { background: #8a8aa0; color: #222; }
.tool.locked .ic { filter: grayscale(1) brightness(.6); }
.tool .price {
  position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
  background: #ffd84d; border: 2px solid #000; border-radius: 999px; padding: 0 6px;
  font-size: 11px; white-space: nowrap;
}
.tool.affordable { animation: wiggle 1.2s infinite; }
@keyframes wiggle { 0%,100% { rotate: 0deg; } 10% { rotate: -6deg; } 20% { rotate: 6deg; } 30% { rotate: 0deg; } }

#toast { z-index: 30;
  position: fixed; left: 50%; top: 64px; transform: translateX(-50%) translateY(-20px);
  background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 12px;
  font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; text-align: center;
  max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 560px) {
  #title { font-size: 16px; }
  #bucks { font-size: 16px; min-width: 70px; padding: 4px 10px; }
  .btns button { width: 34px; height: 34px; font-size: 16px; border-radius: 10px; }
  .btns { gap: 4px; }
  .tool { width: 64px; height: 64px; }
  .tool .ic { font-size: 26px; }
}

#nameBox {
  position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 5;
  background: #fff; border: 3px solid #000; box-shadow: 0 6px 0 #000; border-radius: 16px;
  padding: 16px; display: flex; flex-direction: column; gap: 10px; width: min(300px, calc(100vw - 32px));
  font-weight: 800; color: #222;
}
#nameBox input { font: inherit; font-size: 18px; padding: 8px 10px; border: 3px solid #222; border-radius: 10px; }
#nameBox .row { display: flex; gap: 8px; justify-content: flex-end; }
#nameBox button { font: inherit; padding: 8px 14px; border: 3px solid #000; border-radius: 10px; background: #eee; cursor: pointer; }
#nameBox button[type=submit] { background: #ffd84d; }
[hidden] { display: none !important; }
.tool.busy { background: #ff4d5e; color: #fff; animation: none; }
.tool.busy .ic { filter: saturate(.6); }

#meter {
  position: fixed; left: 12px; top: calc(62px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 6px;
  pointer-events: auto; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #000; font-size: 13px; letter-spacing: 1px;
}
#meter .bar {
  width: min(180px, 40vw); height: 16px; background: #2a1d3a; border: 3px solid #000; border-radius: 999px; overflow: hidden;
  box-shadow: 0 3px 0 #000;
}
#meterFill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb703, #fb5607, #e5383b); transition: width .2s; }
#meterTag {
  background: #555; border: 2px solid #000; border-radius: 8px; padding: 1px 6px; font-size: 12px; letter-spacing: 0;
}
#meter.bonus #meterFill { background: linear-gradient(90deg, #ffe066, #ffd84d, #fff3a3); }
#meter.bonus #meterTag { background: #ffd84d; color: #5a3b00; text-shadow: none; animation: throb .6s infinite alternate; }
@keyframes throb { from { transform: scale(1); } to { transform: scale(1.2); } }
@media (max-width: 560px) { #meter { top: calc(52px + env(safe-area-inset-top, 0px)); } }

#shopScrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 19; }
#shop {
  position: fixed; top: 0; left: 0; bottom: 0; width: min(430px, 92vw); z-index: 20;
  transform: translateX(-105%); transition: transform .35s cubic-bezier(.2,.9,.3,1.15);
  display: flex; flex-direction: column; gap: 10px; color: #fff; overflow: hidden;
  background: var(--sb); border-right: 4px solid #000; box-shadow: 8px 0 0 rgba(0,0,0,.35);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(12px + env(safe-area-inset-bottom, 0px));
  --sb: linear-gradient(#3a2f6b, #211a40); --acc: #ffd84d;
}
#shop.open { transform: none; }
#shop.ph2 { --sb: linear-gradient(#8a2a0e, #2b0a05); --acc: #ff9f1c; }
#shop.ph3 { --sb: repeating-linear-gradient(135deg, #3f4a2e 0 22px, #37412a 22px 44px); --acc: #d4e09b; }
#shop.ph4 { --sb: radial-gradient(circle at 30% 10%, #3b2a7a, #0b0620 70%); --acc: #72efdd; }
#shop.ph5 { --sb: linear-gradient(160deg, #ff5d9e, #7b2cbf); --acc: #fff275; }
.shead { display: flex; gap: 10px; align-items: center; }
#keeperCv { width: 110px; height: 110px; flex: none; background: rgba(255,255,255,.12); border: 3px solid #000; border-radius: 16px; }
.kinfo { flex: 1; min-width: 0; }
.kname { font-weight: 900; font-size: 15px; color: var(--acc); text-shadow: 0 2px 0 #000; }
.ksay { margin-top: 6px; background: #fff; color: #111; border: 3px solid #000; border-radius: 12px; padding: 7px 10px; font-weight: 700; font-size: 13px; min-height: 42px; }
#shopClose { align-self: flex-start; width: 36px; height: 36px; flex: none; border-radius: 10px; border: 3px solid #000; background: #fff; font-size: 18px; cursor: pointer; box-shadow: 0 3px 0 #000; }
#phaseTabs { display: flex; gap: 6px; }
.ptab { flex: 1; height: 38px; border: 3px solid #000; border-radius: 10px; background: rgba(255,255,255,.9); font: inherit; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 3px 0 #000; color: #222; }
.ptab.on { background: var(--acc); transform: translateY(-2px); box-shadow: 0 5px 0 #000; }
.ptab.locked { background: #555; color: #bbb; }
.ptitle b { display: block; font-size: 17px; color: var(--acc); text-shadow: 0 2px 0 #000; }
.ptitle span { font-size: 12px; opacity: .9; }
#shopGrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 4px 2px 12px; align-content: start; }
.item { background: #fff; color: #222; border: 3px solid #000; border-radius: 14px; box-shadow: 0 4px 0 #000; padding: 8px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; }
.item .iic { font-size: 34px; line-height: 1.1; }
.item .inm { font-weight: 900; font-size: 14px; }
.item .ids { font-size: 11px; color: #555; flex: 1; }
.ibuy { width: 100%; margin-top: 4px; border: 3px solid #000; border-radius: 10px; padding: 6px; font: inherit; font-weight: 900; font-size: 14px; background: #ddd; color: #555; cursor: pointer; }
.item.can .ibuy { background: #ffd84d; color: #3b2a00; }
.item.owned .ibuy { background: #80ed99; color: #103b1c; }
.tool.shopbtn { background: #ffd84d; }
.tool.shopbtn i { position: absolute; top: -8px; right: -8px; background: #ff2b2b; color: #fff; font-style: normal; font-size: 10px; border: 2px solid #000; border-radius: 999px; padding: 1px 5px; }

#vaultBox {
  position: fixed; left: 50%; top: 28%; transform: translateX(-50%); z-index: 25;
  width: min(320px, calc(100vw - 32px)); background: #2b2d42; color: #fff; border: 3px solid #000;
  border-radius: 16px; box-shadow: 0 6px 0 #000; padding: 16px; font-weight: 800;
}
#vaultBox > div { display: flex; flex-direction: column; gap: 10px; }
#vaultBox .vtitle { font-size: 20px; color: #ffd84d; text-shadow: 0 2px 0 #000; margin-bottom: 10px; }
#vaultBox p { margin: 0; font-weight: 600; }
#vaultBox input { font: inherit; font-size: 18px; padding: 8px 10px; border: 3px solid #000; border-radius: 10px; letter-spacing: 2px; }
#vaultBox .vmsg { color: #ff6b7a; min-height: 1em; font-size: 13px; }
#vaultBox .row { display: flex; gap: 8px; justify-content: flex-end; }
#vaultBox button { font: inherit; padding: 8px 14px; border: 3px solid #000; border-radius: 10px; background: #eee; cursor: pointer; }
#vaultBox button[type=submit], #vaultClose { background: #ffd84d; }
#vaultBox.shake { animation: vshake .35s; }
@keyframes vshake { 0%,100% { transform: translateX(-50%); } 25% { transform: translateX(calc(-50% - 10px)); } 75% { transform: translateX(calc(-50% + 10px)); } }

#nurseBox {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 24;
  width: min(380px, calc(100vw - 32px)); background: linear-gradient(#ffe3ec, #ffc2d4); color: #222;
  border: 3px solid #000; border-radius: 18px; box-shadow: 0 6px 0 #000; padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
#nurseBox[hidden] { display: none; }
.nhead { display: flex; gap: 10px; align-items: center; }
#nurseCv { width: 96px; height: 96px; flex: none; background: #fff; border: 3px solid #000; border-radius: 14px; }
#nurseBox .kname { color: #d6336c; text-shadow: none; font-size: 17px; }
#nurseClose { align-self: flex-start; width: 34px; height: 34px; flex: none; border-radius: 10px; border: 3px solid #000; background: #fff; font-size: 16px; cursor: pointer; }
.treat {
  display: grid; grid-template-columns: 44px 1fr; grid-template-rows: auto auto; column-gap: 8px; text-align: left;
  background: #fff; border: 3px solid #000; border-radius: 14px; box-shadow: 0 4px 0 #000; padding: 10px; cursor: pointer; font: inherit;
}
.treat:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
.treat span { grid-row: span 2; font-size: 32px; align-self: center; }
.treat b { font-size: 16px; }
.treat small { color: #555; font-size: 12px; }
.tool.nursebtn { background: #ffc2d4; }

#gate {
  position: fixed; inset: 0; z-index: 100; background: #0b0a12; display: flex; align-items: center; justify-content: center;
  padding: 16px; transition: opacity .45s;
}
#gate.open { opacity: 0; pointer-events: none; }
#gateForm { display: flex; flex-direction: column; align-items: stretch; gap: 10px; width: min(300px, 100%); color: #cfcbe0; font-weight: 700; text-align: center; }
#gateForm .glock { font-size: 44px; }
#gateForm input { font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 2px solid #3a3550; background: #16141f; color: #fff; text-align: center; letter-spacing: 3px; outline: none; }
#gateForm input:focus { border-color: #ffd84d; }
#gateForm button { font: inherit; font-size: 16px; padding: 10px; border-radius: 10px; border: 0; background: #ffd84d; color: #3b2a00; font-weight: 900; cursor: pointer; }
#gateMsg { color: #ff6b7a; min-height: 1.2em; font-size: 13px; }
#gateForm.shake { animation: gshake .35s; }
@keyframes gshake { 0%,100% { transform: none; } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

</style>
</head>
<body>
<div id="gate">
  <form id="gateForm" autocomplete="off">
    <div class="glock">🔒</div>
    <label for="gateField">Enter password</label>
    <input id="gateField" type="password" autocomplete="off">
    <div id="gateMsg"></div>
    <button type="submit">Enter</button>
  </form>
</div>

<canvas id="c"></canvas>

<div id="top">
  <div id="bucks" title="Bucks">💰 <span id="bucksVal">0</span></div>
  <div id="title">Kick The <b id="nameLabel">Arham</b></div>
  <div class="btns">
    <button id="btnVault" title="Vault">🔐</button>
    <button id="btnName" title="Rename buddy">✏️</button>
    <button id="btnFace" title="Use a photo as the face">📷</button>
    <button id="btnNoFace" title="Remove photo face" hidden>🙂</button>
    <button id="btnMute" title="Sound on/off">🔊</button>
    <button id="btnClear" title="Clear props and marks">🧹</button>
    <button id="btnReset" title="Reset buddy">🔄</button>
  </div>
  <input type="file" id="faceInput" accept="image/*" hidden>
</div>

<div id="meter" title="Pain meter: fill it to double your bucks">
  <div class="lbl">PAIN</div>
  <div class="bar"><div id="meterFill"></div></div>
  <div id="meterTag">1X</div>
</div>

<div id="tools"></div>
<div id="toast"></div>

<form id="vaultBox" class="dialog" hidden>
  <div class="vtitle">🔐 The Vault</div>
  <div id="vaultLocked">
    <label for="vaultField">Enter the developer password</label>
    <input id="vaultField" type="password" autocomplete="off">
    <div id="vaultMsg" class="vmsg"></div>
    <div class="row"><button type="button" id="vaultCancel">Cancel</button><button type="submit">Unlock</button></div>
  </div>
  <div id="vaultOn" hidden>
    <p>Infinite money is <b>on</b>. Buy whatever you like.</p>
    <div class="row"><button type="button" id="vaultOff">Turn off</button><button type="button" id="vaultClose">Close</button></div>
  </div>
</form>

<div id="nurseBox" hidden>
  <div class="nhead">
    <canvas id="nurseCv" width="240" height="240"></canvas>
    <div class="kinfo"><div class="kname" id="nurseName"></div><div class="ksay" id="nurseSay"></div></div>
    <button id="nurseClose" aria-label="Close nurse station">✕</button>
  </div>
  <button class="treat" id="nurseBandage"><span>🩹</span><b>Bandage up</b><small>Stops the bleeding and covers flesh wounds.</small></button>
  <button class="treat" id="nurseSurgery"><span>🏥</span><b>Full surgery</b><small>Sets broken bones, puts ripped-off limbs back, fixes everything.</small></button>
</div>

<div id="shopScrim" hidden></div>
<aside id="shop" class="ph1" aria-label="Shop">
  <div class="shead">
    <canvas id="keeperCv" width="280" height="280"></canvas>
    <div class="kinfo"><div class="kname" id="keeperName"></div><div class="ksay" id="keeperSay"></div></div>
    <button id="shopClose" aria-label="Close shop">✕</button>
  </div>
  <nav id="phaseTabs"></nav>
  <div class="ptitle"><b id="phaseName"></b><span id="phaseDesc"></span></div>
  <div id="shopGrid"></div>
</aside>
<form id="nameBox" hidden>
  <label for="nameField">Name your buddy</label>
  <input id="nameField" maxlength="16" autocomplete="off">
  <div class="row"><button type="button" id="nameCancel">Cancel</button><button type="submit">Save</button></div>
</form>

<script>
'use strict';
/* Kick The Arham — a Kick the Buddy style stress-relief game.
   Verlet ragdoll physics, weapons, bucks, unlocks, and Boodie. No dependencies. */

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const store = {
  get(k, d) { try { const v = localStorage.getItem('kta_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kta_' + k, JSON.stringify(v)); } catch (e) {} }
};
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
}

// ---------- canvas ----------
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, U = 60, FLOOR = 0, TOP = 0;
let bg = null;

// ---------- state ----------
let bucks = store.get('bucks', 60);
// Vault: the developer password turns on infinite money.
const VAULT_PASSWORD = 'Viboobs';
let infinite = store.get('infinite', false);
const canAfford = price => infinite || bucks >= price;
const showBucks = () => { $('bucksVal').textContent = infinite ? '∞' : bucks; };
let unlocked = new Set(store.get('unlocked', ['hand', 'punch']));
let buddyName = store.get('name', 'Arham');
let muted = store.get('muted', false);
let faceImg = null;
let tool = 'hand';
let earnFrac = 0, idleTimer = 0;
// Pain meter: fills slowly with damage to Arham; when full, bucks are doubled while it drains.
const EARN_RATE = .06, METER_RATE = .1, BONUS_TIME = 30;
let painMeter = store.get('meter', 0), bonusT = store.get('bonusT', 0), meterSaveT = 0;
let shake = 0, flash = 0, flashColor = '#fff', time = 0, hurtFx = 0, whiteT = 0;
let props = [], parts = [], floorStains = [], wallMarks = [], bolts = [], fists = [];
let arham = null, boodie = null;
let ents = [], gravDir = 1, flipT = 0, laserBeam = null, smgCd = 0;
let phasesUnlocked = store.get('phases', 1), shopPhase = 1, shopHasNew = false;
const bodies = () => boodie ? [arham, boodie] : [arham];
const boodieActive = () => !!boodie && !boodie.ko;
const BOODIE_FADE = 6; // seconds a knocked-out Boodie lies there before fading away

// phase: which shop aisle sells it. hold: fires continuously while held. spawn: summons a character.
const TOOLS = [
  // Phase 1 — Starter Stuff
  { id: 'hand', phase: 1, name: 'Hand', icon: '✋', price: 0, desc: 'Grab and fling him around.' },
  { id: 'punch', phase: 1, name: 'Punch', icon: '👊', price: 0, desc: 'A good old knuckle sandwich.' },
  { id: 'knife', phase: 1, name: 'Knife', icon: '🔪', price: 40, desc: 'Drag across him to slice.' },
  { id: 'ball', phase: 1, name: 'Bowling', icon: '🎳', price: 70, desc: 'Drop a heavy bowling ball.' },
  { id: 'pistol', phase: 1, name: 'Pistol', icon: '🔫', price: 120, desc: 'Tap to shoot.' },
  { id: 'bomb', phase: 1, name: 'Bomb', icon: '💣', price: 200, desc: 'Ticking cartoon bomb.' },
  { id: 'fire', phase: 1, name: 'Flamer', icon: '🔥', price: 320, desc: 'Hold to roast him.', hold: true },
  { id: 'anvil', phase: 1, name: 'Anvil', icon: '🪨', price: 450, desc: 'Falls from the ceiling.' },
  { id: 'lightning', phase: 1, name: 'Zeus', icon: '⚡', price: 700, desc: 'Smite him with a bolt.' },
  { id: 'boodie', phase: 1, name: 'Boodie', icon: '👱‍♀️', price: 1500, desc: 'She beats him up for you.', spawn: true },
  // Phase 2 — Inferno
  { id: 'molotov', phase: 2, name: 'Molotov', icon: '🍾', price: 180, desc: 'Shatters into a pool of fire.' },
  { id: 'firework', phase: 2, name: 'Firework', icon: '🎆', price: 220, desc: 'Launches up from the floor and bursts.' },
  { id: 'fireball', phase: 2, name: 'Fireball', icon: '☄️', price: 300, desc: 'Hurl a blazing fireball.' },
  { id: 'lava', phase: 2, name: 'Lava Rain', icon: '🌋', price: 380, desc: 'Molten lava pours from above.' },
  { id: 'napalm', phase: 2, name: 'Napalm', icon: '🛩️', price: 480, desc: 'A plane carpets the floor in fire.' },
  // Phase 3 — Warzone
  { id: 'grenade', phase: 3, name: 'Grenade', icon: '🧨', price: 260, desc: 'Pull the pin. 1.6 second fuse.' },
  { id: 'mine', phase: 3, name: 'Landmine', icon: '💥', price: 320, desc: 'Blows when he steps on it.' },
  { id: 'smg', phase: 3, name: 'SMG', icon: '🔫', price: 420, desc: 'Hold for full-auto fire.', hold: true },
  { id: 'rpg', phase: 3, name: 'Rocket', icon: '🚀', price: 520, desc: 'Rocket-propelled mayhem.' },
  { id: 'airstrike', phase: 3, name: 'Airstrike', icon: '🎯', price: 650, desc: 'Mark a spot. Bombs away.' },
  { id: 'tank', phase: 3, name: 'Tank', icon: '🪖', price: 800, desc: 'Rolls in and shells him 5 times.' },
  // Phase 4 — Cosmic
  { id: 'laser', phase: 4, name: 'Laser', icon: '🔦', price: 450, desc: 'Hold to fire a burning beam.', hold: true },
  { id: 'gravflip', phase: 4, name: 'Gravity Flip', icon: '🙃', price: 550, desc: 'Flips gravity for 5 seconds.' },

function buildBg() {

  const g = b.createLinearGradient(0, 0, 0, FLOOR);

  for (let x = 0; x < W; x += 60) b.fillRect(x, 0, 30, FLOOR);

  for (let y = 30; y < FLOOR - 40; y += 70) for (let x = (y / 70 % 2) * 30 + 15; x < W; x += 60) {

  b.fillStyle = fg; b.fillRect(0, FLOOR, W, H - FLOOR);

  for (let y = FLOOR + 14; y < H; y += 14) { b.beginPath(); b.moveTo(0, y); b.lineTo(W, y); b.stroke(); }

}

let AC = null, master = null, NB = null;

    master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NB.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}

const lastSliceT = new Map();
function doSlice(x0, y0, x1, y1) {

    const h = hitAny(x, y, 0);
    if (!h) continue;
    const key = h.B.kind + h.f, now = performance.now();

    const B = h.B, fr = frame(B, h.f);

}

  }

  p.u = dt => {
    p.age += dt; p.vy += grav() * p.g; p.x += p.vx; p.y += p.vy; p.ang += p.spin;
    if (p.trail) p.trail(p);
    if (p.fuse && p.age >= p.fuse) { p.onHit(p.x, p.y, null); return false; }
    if (p.age > .05) { const h = hitAny(p.x, p.y, .05); if (h) { p.onHit(p.x, p.y, h); return false; } }
    if (p.y > FLOOR - 2) { p.onHit(p.x, FLOOR - 4, null); return false; }

}

    const owned = unlocked.has(t.id), card = document.createElement('div');
    card.className = 'item' + (owned ? ' owned' : '');
    card.dataset.price = t.price;
    const label = owned ? (t.spawn ? (boodieActive() ? 'Fighting…' : 'Spawn') : tool === t.id ? 'Equipped ✓' : 'Equip') : `$${t.price}`;
    card.innerHTML = `<div class="iic">${t.icon}</div><div class="inm">${t.name}</div><div class="ids">${t.desc}</div><button class="ibuy">${label}</button>`;
    card.querySelector('button').onclick = () => buyOrEquip(t);

}
function buyOrEquip(t) {
  initAudio();

    if (!canAfford(t.price)) { sfx('deny'); keeperSay('broke'); return; }
    if (!infinite) bucks -= t.price;
    unlocked.add(t.id);
    store.set('unlocked', [...unlocked]); store.set('bucks', bucks);
    showBucks();
    sfx('buy'); keeperSay('buy');
    if (!t.spawn) { tool = t.id; }
    buildTools(); renderShop();
    return;
  }
  if (t.spawn) {
    if (boodieActive()) { sfx('deny'); keeperSay('busy'); return; }
    spawnBoodie(); openShop(false); return;
  }
  tool = t.id; buildTools(); openShop(false);
}

// ---------- toolbar ----------
function buildTools() {
  const box = $('tools'); box.innerHTML = '';
  const shop = document.createElement('div');
  shop.className = 'tool shopbtn';
  shop.innerHTML = `<div class="ic">🏪</div><div>Shop</div>` + (shopHasNew ? '<i>NEW</i>' : '');
  shop.addEventListener('click', () => { initAudio(); openShop(!shopOpen); });
  box.appendChild(shop);
  const nurse = document.createElement('div');
  nurse.className = 'tool nursebtn';
  nurse.innerHTML = '<div class="ic">🏥</div><div>Nurse</div>';
  nurse.addEventListener('click', () => { initAudio(); openNurse(true); });
  box.appendChild(nurse);
  for (const t of TOOLS) {
    if (!unlocked.has(t.id)) continue;
    const b = document.createElement('div');
    b.className = 'tool'; b.dataset.id = t.id;
    b.innerHTML = `<div class="ic">${t.icon}</div><div>${t.name}</div>`;
    b.addEventListener('click', () => selectTool(t));
    box.appendChild(b);
  }
  refreshTools();
}
function refreshTools() {
  for (const el of document.querySelectorAll('.tool[data-id]')) {
    const t = TOOLS.find(x => x.id === el.dataset.id);
    el.classList.toggle('active', t.id === tool);
    el.classList.toggle('busy', !!t.spawn && boodieActive());
  }
  if (shopOpen) for (const b of document.querySelectorAll('#shopGrid .item.owned .ibuy')) if (b.textContent === 'Fighting…' || b.textContent === 'Spawn') b.textContent = boodieActive() ? 'Fighting…' : 'Spawn';
  refreshAffordable();
}
function refreshAffordable() {
  const any = TOOLS.some(t => t.phase <= phasesUnlocked && !unlocked.has(t.id) && canAfford(t.price));
  const s = document.querySelector('.tool.shopbtn'); if (s) s.classList.toggle('affordable', any);
  for (const c of document.querySelectorAll('#shopGrid .item:not(.owned)')) c.classList.toggle('can', canAfford(+c.dataset.price));
}
function selectTool(t) {
  initAudio();
  if (t.spawn) {
    if (boodieActive()) { sfx('deny'); toast('Boodie is still fighting! Knock her out to spawn a new one.'); return; }
    spawnBoodie();
    return;
  }
  tool = t.id;
  refreshTools();
}

// ---------- shopkeeper portrait ----------
function drawKeeper(dt) {
  const c = $('keeperCv'), k = c.getContext('2d'), S = c.width, K = SHOPKEEPER;
  keeperTalk -= dt; keeperBlink -= dt; if (keeperBlink < -3 - Math.random() * 2) keeperBlink = .12;
  const hat = K.hats[shopPhase - 1] || 'none';
  const bob = Math.sin(time * 2) * 3, cx = S / 2, hy = S * .44 + bob, R = S * .21;
  k.clearRect(0, 0, S, S);
  k.lineWidth = 5; k.strokeStyle = '#1a1a1a'; k.lineJoin = 'round'; k.lineCap = 'round';
  // body + apron
  k.fillStyle = K.shirt; k.beginPath(); k.roundRect(cx - S * .34, S * .72 + bob, S * .68, S * .5, S * .15); k.fill(); k.stroke();
  k.fillStyle = K.apron; k.beginPath(); k.roundRect(cx - S * .2, S * .78 + bob, S * .4, S * .4, 10); k.fill(); k.stroke();
  k.fillStyle = '#ffd84d'; k.font = `900 ${S * .11}px "Trebuchet MS", sans-serif`; k.textAlign = 'center'; k.textBaseline = 'middle';
  k.fillText('$', cx, S * .9 + bob);
  // neck, ears, head
  k.fillStyle = K.skin; k.fillRect(cx - S * .06, hy + R * .75, S * .12, S * .12);
  for (const s of [-1, 1]) { k.beginPath(); k.ellipse(cx + s * R * .98, hy + R * .08, R * .16, R * .22, 0, 0, 7); k.fill(); k.stroke(); }
  k.beginPath(); k.arc(cx, hy, R, 0, 7); k.fill(); k.stroke();
  if (hat !== 'space' && hat !== 'clown') { // side hair
    k.fillStyle = K.hair;
    for (const s of [-1, 1]) { k.beginPath(); k.ellipse(cx + s * R * .8, hy - R * .3, R * .22, R * .35, s * .3, 0, 7); k.fill(); }
  }
  if (hat === 'clown') {
    for (const [i, col] of ['#ff5d9e', '#ffd84d', '#4cc9f0', '#80ed99'].entries()) for (const s of [-1, 1]) {
      k.fillStyle = col; k.beginPath(); k.arc(cx + s * R * (1.05 + (i % 2) * .15), hy - R * .5 + i * R * .25, R * .22, 0, 7); k.fill();
    }
  }
  // eyes
  k.fillStyle = '#1a1a1a';
  for (const s of [-1, 1]) {
    const ex = cx + s * R * .38, ey = hy - R * .08;
    if (keeperBlink > 0) { k.beginPath(); k.moveTo(ex - R * .12, ey); k.lineTo(ex + R * .12, ey); k.stroke(); }
    else { k.beginPath(); k.arc(ex, ey, R * .1, 0, 7); k.fill(); }
  }
  if (K.glasses) {
    k.lineWidth = 4;
    for (const s of [-1, 1]) { k.beginPath(); k.arc(cx + s * R * .38, hy - R * .08, R * .24, 0, 7); k.stroke(); }
    k.beginPath(); k.moveTo(cx - R * .14, hy - R * .1); k.lineTo(cx + R * .14, hy - R * .1); k.stroke();
    k.lineWidth = 5;
  }
  // nose
  if (hat === 'clown') { k.fillStyle = '#ff2b2b'; k.beginPath(); k.arc(cx, hy + R * .18, R * .17, 0, 7); k.fill(); k.stroke(); }
  else { k.beginPath(); k.arc(cx, hy + R * .15, R * .12, .3, Math.PI - .3); k.stroke(); }
  // mouth (talks while speaking)
  const my = hy + R * .52;
  if (keeperTalk > 0) {
    k.fillStyle = '#6b1020'; k.beginPath(); k.ellipse(cx, my, R * .2, R * (.06 + .1 * Math.abs(Math.sin(time * 22))), 0, 0, 7); k.fill(); k.stroke();
  } else { k.beginPath(); k.arc(cx, my - R * .15, R * .28, .2 * Math.PI, .8 * Math.PI); k.stroke(); }
  if (K.beard) { k.fillStyle = K.hair; k.beginPath(); k.arc(cx, hy + R * .35, R * .75, .1 * Math.PI, .9 * Math.PI); k.fill(); }
  if (K.mustache) {
    k.fillStyle = K.hair; k.beginPath();
    k.moveTo(cx, my - R * .2);
    k.bezierCurveTo(cx - R * .25, my - R * .38, cx - R * .55, my - R * .25, cx - R * .6, my - R * .05);
    k.bezierCurveTo(cx - R * .4, my - R * .15, cx - R * .2, my - R * .1, cx, my - R * .12);
    k.bezierCurveTo(cx + R * .2, my - R * .1, cx + R * .4, my - R * .15, cx + R * .6, my - R * .05);
    k.bezierCurveTo(cx + R * .55, my - R * .25, cx + R * .25, my - R * .38, cx, my - R * .2);
    k.fill();
  }
  // hats per phase
  const top = hy - R * .35;
  k.lineWidth = 5; k.strokeStyle = '#1a1a1a';
  if (hat === 'cap') {
    k.fillStyle = '#e63946'; k.beginPath(); k.arc(cx, top, R * .95, Math.PI, 0); k.closePath(); k.fill(); k.stroke();
    k.beginPath(); k.ellipse(cx + R * .75, top, R * .6, R * .13, 0, 0, 7); k.fill(); k.stroke();
    k.fillStyle = '#fff'; k.font = `900 ${R * .45}px "Trebuchet MS", sans-serif`; k.fillText('G', cx, top - R * .45);
  } else if (hat === 'fire') {
    k.fillStyle = '#d62828'; k.beginPath(); k.ellipse(cx, top + R * .05, R * 1.4, R * .24, 0, 0, 7); k.fill(); k.stroke();
    k.beginPath(); k.arc(cx, top, R * .95, Math.PI, 0); k.closePath(); k.fill(); k.stroke();
    k.fillStyle = '#ffd84d'; k.beginPath(); k.moveTo(cx, top - R * .85); k.lineTo(cx + R * .3, top - R * .55); k.lineTo(cx, top - R * .15); k.lineTo(cx - R * .3, top - R * .55); k.closePath(); k.fill(); k.stroke();
  } else if (hat === 'army') {
    k.beginPath(); k.moveTo(cx - R * .9, top + R * .1); k.lineTo(cx - R * .75, hy + R * .75); k.moveTo(cx + R * .9, top + R * .1); k.lineTo(cx + R * .75, hy + R * .75); k.stroke();
    k.fillStyle = '#4b5320'; k.beginPath(); k.arc(cx, top + R * .1, R * 1.08, Math.PI, 0); k.closePath(); k.fill(); k.stroke();
    k.fillStyle = 'rgba(0,0,0,.25)'; for (const [x, y] of [[-.4, -.5], [.3, -.3], [.1, -.8]]) { k.beginPath(); k.arc(cx + x * R, top + y * R, R * .15, 0, 7); k.fill(); }
  } else if (hat === 'space') {
    k.fillStyle = '#ddd'; k.beginPath(); k.roundRect(cx - R * 1.1, hy + R * .9, R * 2.2, R * .35, 8); k.fill(); k.stroke();
    k.fillStyle = 'rgba(180,230,255,.25)'; k.strokeStyle = '#9ad1ff'; k.lineWidth = 6;
    k.beginPath(); k.arc(cx, hy, R * 1.45, 0, 7); k.fill(); k.stroke();
    k.strokeStyle = 'rgba(255,255,255,.8)'; k.lineWidth = 5; k.beginPath(); k.arc(cx, hy, R * 1.2, 3.6, 4.4); k.stroke();
    k.strokeStyle = '#1a1a1a'; k.lineWidth = 4; k.beginPath(); k.moveTo(cx, hy - R * 1.45); k.lineTo(cx, hy - R * 1.8); k.stroke();
    k.fillStyle = (time * 3 | 0) % 2 ? '#ff2b2b' : '#ffd84d'; k.beginPath(); k.arc(cx, hy - R * 1.85, R * .12, 0, 7); k.fill(); k.stroke();
  } else if (hat === 'clown') {
    k.save(); k.beginPath(); k.moveTo(cx - R * .5, top - R * .2); k.lineTo(cx + R * .5, top - R * .2); k.lineTo(cx + R * .1, top - R * 1.5); k.closePath();
    k.fillStyle = '#7b2cbf'; k.fill(); k.clip();
    k.fillStyle = '#ffd84d'; for (let i = 0; i < 5; i++) k.fillRect(cx - R, top - R * (.35 + i * .3), R * 2, R * .12);
    k.restore(); k.beginPath(); k.moveTo(cx - R * .5, top - R * .2); k.lineTo(cx + R * .5, top - R * .2); k.lineTo(cx + R * .1, top - R * 1.5); k.closePath(); k.stroke();
    k.fillStyle = '#fff'; k.beginPath(); k.arc(cx + R * .1, top - R * 1.55, R * .14, 0, 7); k.fill(); k.stroke();
  }
}
function setName(n) {
  buddyName = (n || 'Arham').trim().slice(0, 16) || 'Arham';
  $('nameLabel').textContent = buddyName;
  document.title = `Kick The ${buddyName}`;
  store.set('name', buddyName);
}
function loadFace(src) {
  if (!src) { faceImg = null; $('btnNoFace').hidden = true; return; }
  const img = new Image();
  img.onload = () => { faceImg = img; $('btnNoFace').hidden = false; };
  img.src = src;
}
$('btnName').onclick = () => { $('nameField').value = buddyName; $('nameBox').hidden = false; $('nameField').focus(); $('nameField').select(); };
$('nameCancel').onclick = () => { $('nameBox').hidden = true; };
$('nameBox').onsubmit = e => { e.preventDefault(); setName($('nameField').value); $('nameBox').hidden = true; };
$('btnFace').onclick = () => $('faceInput').click();
$('faceInput').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
    const m = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
    const url = c.toDataURL('image/jpeg', .85);
    store.set('face', url); loadFace(url); URL.revokeObjectURL(img.src);
    toast('New face applied! 😈');
  };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
};
$('shopClose').onclick = () => openShop(false);
$('nurseClose').onclick = () => openNurse(false);
$('nurseBandage').onclick = () => { $('nurseSay').textContent = pick(NURSE.lines.bandage); sendNurse('bandage'); };
$('nurseSurgery').onclick = () => { $('nurseSay').textContent = pick(NURSE.lines.surgery); sendNurse('surgery'); };
$('nurseName').textContent = NURSE.name;
$('shopScrim').onclick = () => openShop(false);
$('keeperName').textContent = `${SHOPKEEPER.name}, ${SHOPKEEPER.title}`;
$('btnNoFace').onclick = () => { store.set('face', null); loadFace(null); };
$('btnMute').onclick = () => { muted = !muted; store.set('muted', muted); $('btnMute').textContent = muted ? '🔇' : '🔊'; initAudio(); };
$('btnClear').onclick = () => { props = []; ents = []; nurseOnDuty = false; gravDir = 1; flipT = 0; boodie = null; refreshTools(); for (const B of bodies()) { B.decals = []; B.bleed = 0; B.swell = 0; } floorStains = []; wallMarks = []; parts = []; grab = null; };
$('btnReset').onclick = () => {
  arham = makeBody('arham', W / 2); boodie = null; nurseOnDuty = false;
  props = []; ents = []; gravDir = 1; flipT = 0; parts = []; floorStains = []; wallMarks = []; grab = null;
  say(arham, 'up', true);
  refreshTools();
};

// ---------- boot ----------
window.addEventListener('resize', resize);
showBucks();
function openVault() {
  $('vaultField').value = ''; $('vaultMsg').textContent = '';
  $('vaultOn').hidden = !infinite; $('vaultLocked').hidden = infinite;
  $('vaultBox').hidden = false;
  if (!infinite) $('vaultField').focus();
}
$('btnVault').onclick = () => { initAudio(); openVault(); };
$('vaultCancel').onclick = $('vaultClose').onclick = () => { $('vaultBox').hidden = true; };
$('vaultBox').onsubmit = e => {
  e.preventDefault();
  if (infinite) return;
  if ($('vaultField').value === VAULT_PASSWORD) {
    infinite = true; store.set('infinite', true);
    showBucks(); refreshAffordable(); if (shopOpen) renderShop();
    $('vaultBox').hidden = true;
    sfx('buy'); toast('🔓 Vault opened! Infinite money unlocked 💰', 2500);
    popText(W / 2, FLOOR * .35, '∞ BUCKS!', '#ffd84d', 56);
  } else {
    sfx('deny'); $('vaultMsg').textContent = 'Wrong password.';
    const b = $('vaultBox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    $('vaultField').select();
  }
};
$('vaultOff').onclick = () => {
  infinite = false; store.set('infinite', false);
  showBucks(); refreshAffordable(); if (shopOpen) renderShop();
  $('vaultBox').hidden = true; toast('Vault locked. Back to earning bucks the hard way.');
};
$('btnMute').textContent = muted ? '🔇' : '🔊';
setName(buddyName);
loadFace(store.get('face', null));
buildTools();
resize();

// password screen: the game stays blank until the developer password is entered
let gateOpen = false;
$('gateForm').onsubmit = e => {
  e.preventDefault();
  if ($('gateField').value === VAULT_PASSWORD) {
    gateOpen = true; $('gate').classList.add('open'); initAudio(); sfx('buy');
    setTimeout(() => { $('gate').hidden = true; }, 500);
    setTimeout(() => toast(`Grab, fling & wreck ${buddyName} to earn 💰 and unlock weapons!`, 3500), 400);
  } else {
    sfx('deny'); $('gateMsg').textContent = 'Wrong password.';
    const f = $('gateForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    $('gateField').select();
  }
};
$('gateField').focus();

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(.1, (now - last) / 1000); last = now;
  const DT = 1 / 60;
  if (!gateOpen) { last = now; acc = 0; requestAnimationFrame(loop); return; }
  while (acc >= DT) { step(DT); acc -= DT; }
  draw();
  if (shopOpen) drawKeeper(DT);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// debug/testing hook
window.KTA = { get ents() { return ents; }, unlockAll() { phasesUnlocked = 5; TOOLS.forEach(t => unlocked.add(t.id)); buildTools(); }, set tool(t) { tool = t; }, openShop, get arham() { return arham; }, get boodie() { return boodie; }, get props() { return props; }, addBucks, explode, spawnBoodie };

</script>
