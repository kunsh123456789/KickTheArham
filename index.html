<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kick The Arham</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="bucks" title="Bucks">💰 <span id="bucksVal">0</span></div>
  <div id="title">Kick The <b id="nameLabel">Arham</b></div>
  <div class="btns">
    <button id="btnVault" title="Vault">🔐</button>
    <button id="btnName" title="Rename buddy">✏️</button>
    <button id="btnFace" title="Use a photo as the face">📷</button>
    <button id="btnNoFace" title="Remove photo face" hidden>🙂</button>
    <button id="btnMute" title="Sound on/off">🔊</button>
    <button id="btnClear" title="Clear props and marks">🧹</button>
    <button id="btnReset" title="Reset buddy">🔄</button>
  </div>
  <input type="file" id="faceInput" accept="image/*" hidden>
</div>

<div id="meter" title="Pain meter: fill it to double your bucks">
  <div class="lbl">PAIN</div>
  <div class="bar"><div id="meterFill"></div></div>
  <div id="meterTag">1X</div>
</div>

<div id="tools"></div>
<div id="toast"></div>

<form id="vaultBox" class="dialog" hidden>
  <div class="vtitle">🔐 The Vault</div>
  <div id="vaultLocked">
    <label for="vaultField">Enter the developer password</label>
    <input id="vaultField" type="password" autocomplete="off">
    <div id="vaultMsg" class="vmsg"></div>
    <div class="row"><button type="button" id="vaultCancel">Cancel</button><button type="submit">Unlock</button></div>
  </div>
  <div id="vaultOn" hidden>
    <p>Infinite money is <b>on</b>. Buy whatever you like.</p>
    <div class="row"><button type="button" id="vaultOff">Turn off</button><button type="button" id="vaultClose">Close</button></div>
  </div>
</form>

<div id="shopScrim" hidden></div>
<aside id="shop" class="ph1" aria-label="Shop">
  <div class="shead">
    <canvas id="keeperCv" width="280" height="280"></canvas>
    <div class="kinfo"><div class="kname" id="keeperName"></div><div class="ksay" id="keeperSay"></div></div>
    <button id="shopClose" aria-label="Close shop">✕</button>
  </div>
  <nav id="phaseTabs"></nav>
  <div class="ptitle"><b id="phaseName"></b><span id="phaseDesc"></span></div>
  <div id="shopGrid"></div>
</aside>
<form id="nameBox" hidden>
  <label for="nameField">Name your buddy</label>
  <input id="nameField" maxlength="16" autocomplete="off">
  <div class="row"><button type="button" id="nameCancel">Cancel</button><button type="submit">Save</button></div>
</form>

<script src="game.js"></script>
</body>
</html>
